<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zpěvník</title>
<meta name="theme-color" content="#8f3a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f7f3ec;--panel:#fffdf9;--ink:#211c16;--muted:#7a7064;--line:#e4dccf;--accent:#8f3a1e;--chord:#b0381a;--note-bg:#ffefae;--note-ink:#5e4400;--chorus:#f1e9dc;--hover:#f0e8db}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--panel:#1d1a16;--ink:#ece5da;--muted:#9a9186;--line:#332e27;--accent:#e58a63;--chord:#f2995f;--note-bg:#4b3d0e;--note-ink:#ffe08a;--chorus:#25211b;--hover:#2a251f}}
:root[data-theme="dark"]{--bg:#15130f;--panel:#1d1a16;--ink:#ece5da;--muted:#9a9186;--line:#332e27;--accent:#e58a63;--chord:#f2995f;--note-bg:#4b3d0e;--note-ink:#ffe08a;--chorus:#25211b;--hover:#2a251f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;min-height:34px}
button:hover{background:var(--hover)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:#c0392b}
button.ghost{border-color:transparent;background:transparent}
select,input[type=text],input[type=number],input[type=search],textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:34px}
.sp{flex:1}
#bar{display:flex;align-items:center;gap:6px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#bar h1{font-size:18px;margin:0 8px 0 0;color:var(--accent);letter-spacing:.3px}
#app{flex:1;display:flex;min-height:0}
#side{width:300px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#side .sh{padding:8px;border-bottom:1px solid var(--line)}
#q{width:100%}
#count{font-size:12px;color:var(--muted);padding:4px 10px}
#list{flex:1;overflow:auto;padding:0 6px 20px}
#list .it{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:none;padding:7px 10px;min-height:0;white-space:normal}
#list .it:hover{background:var(--hover)}
#list .it.act{background:var(--chorus)}
#list .it b{display:block;font-weight:600}
#list .it span{font-size:12px;color:var(--muted)}
#main{flex:1;overflow:auto;min-width:0;position:relative}
.vbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:8px 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.vbar .grp{display:flex;align-items:center;gap:2px}
.vbar .trl{min-width:3.2em;text-align:center;font-size:13px;color:var(--muted)}
.mob{display:none}
.welcome{padding:40px;max-width:640px;color:var(--muted)}
.welcome h2{color:var(--ink)}
/* song */
.song{padding:16px 22px 45vh;max-width:980px}
.shead h1{font-size:1.55em;margin:0;line-height:1.2}
.artist{color:var(--muted);font-size:.95em}
.meta{color:var(--muted);font-size:.78em;display:flex;gap:1.1em;flex-wrap:wrap;margin-top:.2em}
.blk{margin:0 0 .95em}
.b-chorus{border-left:3px solid var(--accent);padding-left:.7em}
.b-bridge{border-left:3px dashed var(--muted);padding-left:.7em}
.blab{font-weight:700;font-size:.82em;color:var(--accent)}
.chorusref{font-weight:700;color:var(--accent);font-style:italic}
.ln{white-space:pre-wrap;line-height:1.3;border-radius:4px}
.ln.hc{margin-top:.15em}
.wd{white-space:nowrap}
.sg{display:inline-block;white-space:pre}
.sg .c{display:block;color:var(--chord);font-weight:700;font-size:.82em;line-height:1.15;padding-right:.35em}
.cmt .lt{font-style:italic;color:var(--muted);background:var(--chorus);display:inline-block;padding:0 .45em;border-radius:4px}
.tab .lt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8em;white-space:pre;overflow-x:auto}
.notes{display:flex;gap:.3em;flex-wrap:wrap;margin:.2em 0 .05em}
.note{background:var(--note-bg);color:var(--note-ink);font-size:.74em;border-radius:4px;padding:.05em .5em;font-weight:600;line-height:1.5}
.annot [data-src]{cursor:pointer}
.annot [data-src]:hover{background:var(--hover);outline:1px dashed var(--accent)}
.annot .note{outline:1px solid var(--note-ink)}
.btab{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.68em;line-height:1.2;white-space:pre;overflow-x:auto;margin:.25em 0 .45em;background:var(--chorus);padding:.35em .55em;border-radius:5px;color:var(--ink)}
.btab.bline{margin:.35em 0 .1em;padding:.2em .45em}
.btab.bline{cursor:pointer}
.btab.bline:hover{outline:1px dashed var(--chord)}
.btw{display:flex;align-items:flex-start;gap:4px}
.btw pre{flex:1;min-width:0;position:relative}
.btact{display:flex;flex-direction:column;gap:3px;margin-top:.35em}
.btact button{font-size:12px;padding:2px 7px;line-height:1.4;min-width:28px}
.btact button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btw.playing pre{outline:2px solid var(--accent)}
.btab.custom{border-left:3px solid var(--chord)}
.bcur{position:absolute;background:var(--accent);opacity:.3;border-radius:3px;pointer-events:none}
.bhl{background:var(--hover);border-radius:6px}
.bplayctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.bplayctl input[type=number]{width:4.2em;font-family:inherit}
.bplayctl input[type=checkbox]{width:auto}
.bassbar .bplayctl button.on{background:#c0392b;border-color:#c0392b}
.mbox.wide{max-width:min(96vw,1100px)}
.bted{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin-top:10px}
.bteb{background:var(--chorus);border-radius:8px;padding:6px}
.btebh{display:flex;gap:4px;margin-bottom:4px}
.btebh .btname{flex:1;min-width:0;width:5em;font-weight:700;color:var(--chord);padding:3px 6px;background:var(--panel);border:1px solid var(--line)}
.btebh button{padding:2px 8px}
.bteb table{border-collapse:collapse}
.bteb th{font:600 12px ui-monospace,Menlo,monospace;color:var(--muted);padding-right:4px}
.bteb td{padding:1px;border-bottom:1px solid var(--line)}
.bteb td input{width:2.1em;text-align:center;padding:3px 0;font:600 14px ui-monospace,Menlo,monospace;border-radius:4px;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.bteb td input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.bteb td.hl input{background:var(--accent);color:#fff}
.btebf{display:flex;gap:4px;margin-top:5px}
.btebf select{font-size:12px;padding:2px}
.btadd{align-self:stretch;min-height:80px;font-size:13px}
.bthelp{font-size:12px;color:var(--muted);margin:10px 0 4px}
.btdir{display:block;font-size:11px;color:var(--muted);word-break:break-all}
.barsel{display:flex;flex-wrap:wrap;gap:10px}
.barsel label{display:flex;flex-direction:column;gap:3px;align-items:flex-start;font-size:14px}
.barsel b{color:var(--chord)}
.barsel small{color:var(--muted);font-size:11px}
.bassln{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78em;color:var(--chord);white-space:pre-wrap;margin-top:.15em}
.bassbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;background:var(--chorus);padding:8px 10px;border-radius:8px;margin-bottom:12px}
.bassbar select{max-width:100%}
.bassbar input{font-family:ui-monospace,Menlo,monospace;width:11em}
.bassbar small{color:var(--muted);flex-basis:100%}
.annot .bassln{outline:1px dashed var(--chord)}
.annot-tip{background:var(--note-bg);color:var(--note-ink);padding:6px 10px;border-radius:8px;font-size:13px;margin-bottom:10px}
.dgs{display:flex;flex-wrap:wrap;gap:.5em .8em;margin:.6em 0 1.1em}
.dg{display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:.78em;user-select:none}
.dg b{color:var(--chord)}
.dg svg{height:6em;width:auto;display:block}
.dg small{color:var(--muted);font-size:.8em}
/* editor */
.efields{display:grid;grid-template-columns:2fr 2fr .8fr .8fr .8fr;gap:8px;padding:10px 12px 4px}
.efields label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);min-width:0}
.efields input{width:100%;font-size:15px}
@media (max-width:760px){.efields{grid-template-columns:1fr 1fr 1fr}.efields .wide{grid-column:1/-1}}
.etools{display:flex;gap:5px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.edit{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100% - 110px)}
.edit textarea{border:0;border-right:1px solid var(--line);border-radius:0;resize:none;padding:14px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:70vh;outline:none}
.edit .song{padding-bottom:30px;font-size:15px}
details.help{padding:10px 14px;font-size:13px;color:var(--muted)}
details.help code{background:var(--chorus);padding:0 4px;border-radius:3px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border-radius:14px;padding:18px;max-width:620px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 12px}
.mfoot{display:flex;gap:6px;margin-top:14px;align-items:center;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid label,.mcol label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.mcol{display:flex;flex-direction:column;gap:8px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0;font-size:14px}
.checks label{display:flex;gap:6px;align-items:center}
.ctx{background:var(--chorus);padding:8px 10px;border-radius:8px;margin-bottom:10px;font-size:14px;white-space:pre-wrap}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.presets button{font-size:13px;min-height:30px;padding:4px 8px}
.plist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px}
.plist label{display:flex;gap:8px;align-items:center;padding:2px 0;font-size:14px}
.plist small{color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{text-align:left;white-space:normal}
.menu button small{display:block;color:var(--muted);font-size:12px}
.mbox.dark-btns .menu button.pri small{color:#ffffffcc}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw}
#toast.show{opacity:1}
#syncBtn.serr{color:#c0392b;border-color:#c0392b}
#syncBtn.sok{color:var(--accent)}
#scrollCtl{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:30;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 4px 18px rgba(0,0,0,.2)}
#scrollCtl[hidden]{display:none}
#scrollCtl span{min-width:3em;text-align:center;font-size:13px}
/* print preview */
#printView{position:fixed;inset:0;z-index:50;overflow:auto;background:#6b6660}
#printView[hidden]{display:none}
.ptools{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#pages{--ink:#111;--muted:#555;--chord:#a3301a;--accent:#a3301a;--note-bg:#fff0b0;--note-ink:#4d3800;--chorus:#f3eee6;--line:#ccc;--hover:transparent;padding:10px 0 40px}
#pages.bw{--chord:#000;--accent:#000;--note-bg:#fff;--note-ink:#000;--chorus:#fff}
#pages.bw .note{border:1px solid #000}
#pages.bw .cmt .lt{border:1px solid #999}
.page{background:#fff;color:#111;margin:14px auto;box-shadow:0 3px 14px rgba(0,0,0,.35);position:relative;overflow:hidden}
.pcols{display:flex}
.pcol,.pmeasure{font-size:var(--pfont);line-height:1.3;min-width:0}
.pcol{flex:1 1 0}
.pmeasure{position:absolute;left:-20000px;top:0;visibility:hidden}
.pb{display:flow-root;padding-bottom:.55em}
.pb .blk{margin:0}
.ps-head{padding-top:.2em}
.ps-head h1{font-size:1.35em}
.ps-head .dgs{margin:.35em 0 .1em}
.ps-head .dg svg{height:5em}
.pfoot{position:absolute;left:0;right:0;text-align:center;font-size:8.5pt;color:#666}
.cover{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.cover h1{font-size:34pt;margin:0}
.cover p{color:#666;font-size:12pt}
.toc-h{font-size:1.5em;font-weight:700;margin-bottom:.3em}
.toc-row{display:flex;gap:.5em;border-bottom:1px dotted #bbb;padding:.12em 0}
.toc-row .tt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.toc-row small{color:#666}
.toc-row .pg{width:2.4em;text-align:right;flex:none}
@media (max-width:760px){
  #side{width:100%;border:0}
  body.in-song #side{display:none}
  body:not(.in-song) #main{display:none}
  body.in-song #bar{display:none}
  .mob{display:inline-flex}
  .desk{display:none}
  .song{padding:12px 14px 45vh}
  .vbar{padding:6px 8px;gap:4px}
  .vbar select{max-width:8.5em}
  .btab{font-size:.56em;padding:.35em .4em}
  .vbar button{padding:6px 8px}
  .edit{grid-template-columns:1fr}
  .edit textarea{border-right:0;border-bottom:1px solid var(--line);min-height:55vh}
  .mgrid{grid-template-columns:1fr}
  #bar h1{font-size:17px}
}
@media print{
  html,body{height:auto;overflow:visible;display:block;background:#fff}
  body>*{display:none!important}
  body>#printView{display:block!important;position:static;overflow:visible;background:none}
  .ptools{display:none!important}
  #pages{padding:0}
  .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
<style id="pageStyle">@page{size:A4;margin:0}</style>
</head>
<body>
<header id="bar">
  <h1>♪ Zpěvník</h1>
  <button data-act="new" title="Nová píseň">＋ Nová</button>
  <button data-act="data" title="Import a export">⇅ Data</button>
  <button data-act="print" title="Tisk a export do PDF">🖨 Tisk / PDF</button>
  <span class="sp"></span>
  <button data-act="sync" id="syncBtn" title="Synchronizace písní">☁</button>
  <button data-act="settings" title="Nastavení">⚙</button>
</header>
<div id="app">
  <aside id="side">
    <div class="sh"><input type="search" id="q" placeholder="Hledat název, interpreta, text…" autocomplete="off"></div>
    <div id="count"></div>
    <div id="list"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" hidden></div>
<div id="printView" hidden></div>
<div id="scrollCtl" hidden><button data-sc="-">−</button><span id="scSpeed"></span><button data-sc="+">+</button><button data-sc="stop">■</button></div>
<div id="toast"></div>
<input type="file" id="fileIn" multiple hidden accept=".cho,.chopro,.chordpro,.crd,.pro,.txt,.json,text/plain,application/json">
<script id="zpevnik-data" type="application/json">null</script>
<script>
'use strict';
/* ============ základ ============ */
const TEMPLATE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const LS = 'zpevnik.v1';
const DEF = {instrument:'guitar', czech:true, chords:true, diagrams:true, notes:true, font:18, theme:'auto', wake:true, scrollSpeed:22, voicing:{}, bass:false, bassPos:'line', bassInstr:'electric', bassClick:false, bassFills:true, bassSound:'upright', bassLoop:false, bookTitle:'Zpěvník', print:null};
let db = {songs:[], settings:{...DEF}, embedSeen:0, deleted:{}};
const S = () => db.settings;
let state = {mode:'list', id:null, annot:false};

function save(fromSync) {
  try { localStorage.setItem(LS, JSON.stringify(db, (k, v) => k[0] === '_' ? undefined : v)); }
  catch (e) { toast('Nepodařilo se uložit do prohlížeče!'); }
  if (!fromSync) try { syncOnSave(); } catch (e) {}
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}
function download(name, content, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type: mime}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const cleanText = t => String(t || '').replace(/\r\n?/g, '\n');

/* ============ hudební teorie ============ */
const BASE = {C:0, D:2, E:4, F:5, G:7, A:9, B:11, H:11};
const NAMES_CZ = ['C','C#','D','Eb','E','F','F#','G','Ab','A','B','H'];
const NAMES_EN = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const CH_RE = /^([A-H])([#b♯♭]?)(.*?)(?:\/([A-H])([#b♯♭]?))?$/;
function pcOf(L, a) {
  if (L === 'B' && S().czech) return (a === '#' || a === '♯') ? 11 : 10;
  let pc = BASE[L];
  if (a === '#' || a === '♯') pc++; else if (a === 'b' || a === '♭') pc--;
  return (pc + 12) % 12;
}
function splitChord(c) {
  const m = String(c).trim().match(CH_RE);
  if (!m) return null;
  return {root: pcOf(m[1], m[2]), suffix: m[3] || '', bass: m[4] ? pcOf(m[4], m[5]) : null};
}
const SUFFIX_OK = /^(maj|min|mi|m|M|dim|aug|sus|add|no|omit|°|ø|Δ|\+|-|#|b|♯|♭|\d|\(|\)|\/)*$/;
function isChord(tok) {
  const t = tok.replace(/^\(|\)$/g, '');
  const m = t.match(CH_RE);
  return !!m && SUFFIX_OK.test(m[3] || '');
}
function noteName(pc) { return (S().czech ? NAMES_CZ : NAMES_EN)[((pc % 12) + 12) % 12]; }
function transposeChord(c, n) {
  if (!n) return c;
  const w = String(c).match(/^(\(?)(.*?)(\)?)$/);
  const s = splitChord(w[2]);
  if (!s || !SUFFIX_OK.test(s.suffix)) return c;
  return w[1] + noteName(s.root + n) + s.suffix + (s.bass != null ? '/' + noteName(s.bass + n) : '') + w[3];
}
function qualityIntervals(q) {
  let s = (q || '').replace(/[()\s]/g, ''), third = 4, fifth = 7, sev = null, m;
  const ext = [];
  if (/^[øØ]/.test(s)) { third = 3; fifth = 6; sev = 10; s = s.slice(1); if (s[0] === '7') s = s.slice(1); }
  else if ((m = s.match(/^(dim|°|o)/))) { third = 3; fifth = 6; s = s.slice(m[0].length); if (s[0] === '7') { sev = 9; s = s.slice(1); } }
  else if ((m = s.match(/^(aug|\+)/))) { fifth = 8; s = s.slice(m[0].length); }
  else if ((m = s.match(/^(min|mi|m(?!aj)|-)/))) { third = 3; s = s.slice(m[0].length); }

  if (o.tr && !o.print) meta.push('Transpozice: ' + (o.tr > 0 ? '+' : '') + o.tr);
  return `<div class="shead"><h1>${esc(p.title || 'Bez názvu')}</h1>${p.artist ? `<div class="artist">${esc(p.artist)}</div>` : ''}${meta.length ? `<div class="meta">${meta.map(x => `<span>${x}</span>`).join('')}</div>` : ''}</div>`;
}
function songHTML(p, o) {

/* ============ akordy nad textem → ChordPro ============ */
const REPEAT_TOK = /^(\|+|:|\|:|:\||\|\||x?\d+x?|\/|-+|%|\.+|\(|\))$/i;
function isChordLine(line) {
  if (!line || !line.trim() || /^\s*\{/.test(line)) return false;
  const toks = line.trim().split(/\s+/);
  let n = 0;
  for (const t of toks) { if (isChord(t)) n++; else if (!REPEAT_TOK.test(t)) return false; }
  return n > 0;
}
function convertChordsOverText(text) {
  const L = cleanText(text).split('\n'), out = [];
  for (let i = 0; i < L.length; i++) {
    const a = L[i];
    if (!isChordLine(a)) { out.push(a); continue; }
    const ch = [...a.matchAll(/\S+/g)].map(m => ({pos: m.index, c: m[0]}));
    const b = L[i + 1];
    if (b != null && b.trim() && !isChordLine(b) && !/^\s*\{/.test(b)) {
      let s = b; const maxPos = ch[ch.length - 1].pos;
      if (s.length < maxPos) s = s.padEnd(maxPos, ' ');
      for (let k = ch.length - 1; k >= 0; k--) s = s.slice(0, ch[k].pos) + '[' + ch[k].c + ']' + s.slice(ch[k].pos);
      out.push(s.replace(/\s+$/, '')); i++;
    } else out.push(ch.map(x => '[' + x.c + ']').join(' '));
  }
  return out.join('\n');
}

    else if ((s.updated || 0) > (ex.updated || 0)) { ex.text = cleanText(s.text); ex.transpose = s.transpose || 0; ex.updated = s.updated; updated++; }

async function importFiles(files) {
  let added = 0, updated = 0;
  for (const f of files) {
    const t = cleanText(await f.text());
    let parsed = null;
    if (/^\s*[\[{]\s*["\[{]/.test(t)) { try { parsed = JSON.parse(t); } catch (e) {} }
    if (parsed) {
      const r = mergeSongs(Array.isArray(parsed) ? parsed : parsed.songs);
      added += r.added; updated += r.updated; continue;
    }
    const parts = t.split(/^\s*\{\s*(?:new_song|ns)\s*\}\s*$/im);
    for (let part of parts) {
      part = part.trim(); if (!part) continue;
      if (!/\[[^\]]+\]/.test(part)) part = convertChordsOverText(part);
      if (!/\{\s*(title|t)\s*[:\s]/i.test(part)) {
        const lines = part.split('\n'); const first = (lines[0] || '').trim();
        if (parts.length > 1 || (first && !first.includes('[') && !first.startsWith('{') && first.length < 60 && lines.length > 2)) {
          part = `{title: ${first}}\n` + lines.slice(1).join('\n');
        } else part = `{title: ${f.name.replace(/\.[^.]+$/, '')}}\n` + part;
      }
      db.songs.push({id: uid(), text: part, transpose: 0, updated: Date.now()}); added++;
    }
  }
  save(); renderList();
  toast(`Importováno: ${added} nových` + (updated ? `, ${updated} aktualizováno` : ''));
}

/* ---- počet taktů akordů v basovém tabu ---- */
function barsModal(song, src) {
  let line = null;
  for (const b of P(song).blocks) for (const l of b.lines) if (l.t === 'ly' && l.src === src) line = l;
  if (!line) return;
  const tr = song.transpose || 0;
  const list = (line.carry ? [{c: transposeChord(line.carry, tr), carry: true}] : []).concat(line.chs.map(c => ({c: transposeChord(c, tr)})));
  const cur = list.map((_, i) => (line.bars && line.bars[i]) || 1);
  const OPTS = [.25, .5, 1, 2, 3, 4, 6, 8];
  const text = line.parts.map(p => p.text).join('');
  modal(`<h3>Počet taktů – basový tab</h3>
    <div class="ctx">${esc(text.trim() || '…')}</div>
    <div class="barsel">${list.map((x, i) => `<label><b>${esc(x.carry ? '(' + x.c + ')' : x.c)}</b>${x.carry ? '<small>pokračuje</small>' : ''}
      <select data-bi="${i}">${OPTS.map(n => `<option value="${n}"${n === cur[i] ? ' selected' : ''}>${fmtBars(n)} ${n < 1 ? 'taktu' : n === 1 ? 'takt' : n < 5 ? 'takty' : 'taktů'}</option>`).join('')}</select></label>`).join('')}</div>
    <p style="font-size:12px;color:var(--muted);margin:10px 0 0">Uloží se do písně jako <code>{x_bars: …}</code> nad řádkem (jiné aplikace to ignorují).</p>
    <div class="mfoot"><button data-act="breset">Vše po 1 taktu</button><span class="sp"></span><button data-act="close">Zrušit</button><button data-act="bok" class="pri">Uložit</button></div>`, e => {
    const a = e.target.closest('[data-act]')?.dataset.act;
    if (a === 'breset') { $$('.barsel select').forEach(x => x.value = '1'); return; }
    if (a !== 'bok') return;
    const vals = $$('.barsel select').map(x => +x.value);
    const lines = song.text.split('\n');
    const dir = vals.every(v => v === 1) ? null : `{x_bars: ${vals.map(fmtBars).join(' ')}}`;
    if (line.barsSrc != null) { if (dir) lines[line.barsSrc] = dir; else lines.splice(line.barsSrc, 1); }
    else if (dir) lines.splice(line.src, 0, dir);
    song.text = lines.join('\n'); song.updated = Date.now(); save(); closeModal(); renderView(true);
  });
}

const scr = {on:false, raf:0, acc:0, last:0};
function startScroll() {
  scr.on = true; scr.last = performance.now(); scr.acc = 0;
  const el = $('#main');
  const step = t => {
    if (!scr.on) return;
    const dt = Math.min(.1, (t - scr.last) / 1000); scr.last = t;
    scr.acc += S().scrollSpeed * dt;
    const d = Math.floor(scr.acc);
    if (d) { el.scrollTop += d; scr.acc -= d; }
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 2) { stopScroll(); return; }
    scr.raf = requestAnimationFrame(step);
  };
  scr.raf = requestAnimationFrame(step);
  $('#scrollCtl').hidden = false; $('#scSpeed').textContent = S().scrollSpeed;
  wake(true);
}
function stopScroll() { scr.on = false; cancelAnimationFrame(scr.raf); $('#scrollCtl').hidden = true; }
let wl = null;
async function wake(on) {
  try {
    if (on && S().wake && 'wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); }
    else if (!on && wl) { await wl.release(); wl = null; }
  } catch (e) {}
}

function getDir(text, f) {

function setDir(text, f, value) {

function makeLayout(cols, colH, measure) {
  const L = {pages: [], col: 0, y: 0};
  L.newPage = () => { L.pages.push({cols: Array.from({length: cols}, () => [])}); L.col = 0; L.y = 0; };

  L.put = (html, h) => { L.pages[L.pages.length - 1].cols[L.col].push(html); L.y += h; };
  L.place = it => {
    if (it.h <= colH - L.y + .5) return L.put(it.html, it.h);
    if (it.h <= colH && L.y > 0) { L.nextCol(); return L.put(it.html, it.h); }
    if (!it.lines) { if (L.y > 0) L.nextCol(); return L.put(it.html, it.h); }
    let rest = it.lines.slice();
    while (rest.length) {
      let n = 0, hh = 0;
      for (let k = 1; k <= rest.length; k++) { const h = measure(it.make(rest.slice(0, k))); if (h <= colH - L.y + .5) { n = k; hh = h; } else break; }

      L.put(it.make(rest.slice(0, n)), hh); rest = rest.slice(n);
      if (rest.length) L.nextCol();
    }
  };
  L.trim = () => { while (L.pages.length > 1 && L.pages[L.pages.length - 1].cols.every(c => !c.length)) L.pages.pop(); };
  L.newPage();
  return L;
}

/* ============ automatická synchronizace přes GitHub Gist ============ */
// přístupový klíč a ID gistu jsou v samostatném klíči localStorage – nikdy se neexportují s aplikací ani se zálohou
const SYNC_LS = 'zpevnik.sync', SYNC_FILE = 'zpevnik-sync.json';
const SY = {cfg: {}, busy: false, again: false, timer: 0, state: 'off', msg: '', sig: ''};
try { SY.cfg = JSON.parse(localStorage.getItem(SYNC_LS) || '{}') || {}; } catch (e) {}
const syncSaveCfg = () => { try { localStorage.setItem(SYNC_LS, JSON.stringify(SY.cfg)); } catch (e) {} };
const SYNC_TXT = {off: 'vypnutá', ok: 'aktuální', busy: 'probíhá…', err: 'chyba', offline: 'bez internetu – dosynchronizuje se později'};
function syncStatus(state, msg) {
  SY.state = state; SY.msg = msg || '';
  const b = $('#syncBtn'); if (!b) return;
  b.textContent = {off: '☁', ok: '☁ ✓', busy: '☁ …', err: '☁ !', offline: '☁ ⨯'}[state] || '☁';
  b.title = 'Synchronizace: ' + SYNC_TXT[state] + (SY.msg ? ' (' + SY.msg + ')' : '');
  b.classList.toggle('serr', state === 'err'); b.classList.toggle('sok', state === 'ok');
  const m = $('#syncState'); if (m) m.textContent = SYNC_TXT[state] + (SY.msg ? ' – ' + SY.msg : '');
}
async function gh(path, opt = {}) {
  const headers = {'Authorization': 'Bearer ' + SY.cfg.token, 'Accept': 'application/vnd.github+json'};
  if (opt.body) headers['Content-Type'] = 'application/json';
  const r = await fetch('https://api.github.com' + path, {method: opt.method || 'GET', body: opt.body, headers, cache: 'no-store'});
  if (!r.ok) { const e = new Error(r.status === 401 ? 'neplatný nebo prošlý přístupový klíč' : r.status === 403 ? 'klíč nemá oprávnění „gist“' : r.status === 404 ? 'gist nenalezen' : 'GitHub odpověděl ' + r.status); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
function syncPayload() {
  const del = db.deleted || {};
  return JSON.stringify({app: 'zpevnik', v: 1,
    songs: db.songs.map(x => ({id: x.id, text: x.text, transpose: x.transpose || 0, updated: x.updated || 0})).sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0),
    deleted: Object.fromEntries(Object.keys(del).sort().map(k => [k, del[k]]))});
}
// sloučení: u každé písně vyhrává novější verze, smazání platí, pokud je novější než poslední úprava
function syncMerge(remote) {
  let changed = false;
  const del = db.deleted || (db.deleted = {});
  for (const [id, t] of Object.entries(remote.deleted || {})) if (!(del[id] >= t)) { del[id] = t; changed = true; }
  for (const x of remote.songs || []) {
    if (!x || typeof x.text !== 'string' || !x.id) continue;
    if (del[x.id] >= (x.updated || 0)) continue;
    const ex = db.songs.find(y => y.id === x.id);
    if (!ex) { db.songs.push({id: x.id, text: x.text, transpose: x.transpose || 0, updated: x.updated || 0}); changed = true; }
    else if ((x.updated || 0) > (ex.updated || 0)) { ex.text = x.text; ex.transpose = x.transpose || 0; ex.updated = x.updated; changed = true; }
  }
  const n = db.songs.length;
  db.songs = db.songs.filter(y => !(del[y.id] >= (y.updated || 0)));
  if (db.songs.length !== n) changed = true;
  for (const y of db.songs) if (del[y.id] && del[y.id] < (y.updated || 0)) delete del[y.id]; // píseň po smazání znovu upravená → platí
  const old = Date.now() - 400 * 864e5; for (const k in del) if (del[k] < old) delete del[k];
  return changed;
}
function syncRefresh() {
  if (state.mode === 'view') { if (curSong()) renderView(true); else route(); }
  else if (state.mode !== 'edit' && state.mode !== 'new') route();
  renderList();
}
async function syncNow(manual) {
  if (!SY.cfg.token) { syncStatus('off'); return; }
  if (SY.busy) { SY.again = true; return; }
  if (!navigator.onLine) { syncStatus('offline'); if (manual) toast('Jsi offline – synchronizuje se, až bude internet.'); return; }
  SY.busy = true; syncStatus('busy');
  try {
    let gist = null;
    if (SY.cfg.gistId) { try { gist = await gh('/gists/' + SY.cfg.gistId); } catch (e) { if (e.status !== 404) throw e; SY.cfg.gistId = null; } }
    for (let page = 1; !gist && page <= 10; page++) { // nové zařízení: najdi existující gist se zpěvníkem
      const list = await gh('/gists?per_page=100&page=' + page);
      const g = list.find(x => x.files && x.files[SYNC_FILE]);
      if (g) gist = await gh('/gists/' + g.id);
      if (list.length < 100) break;
    }
    let remoteStr = '', remote = null;
    if (gist) {
      SY.cfg.gistId = gist.id; SY.cfg.url = gist.html_url;
      const f = gist.files[SYNC_FILE];
      if (f) remoteStr = f.truncated ? await (await fetch(f.raw_url, {cache: 'no-store'})).text() : f.content;
      try { remote = JSON.parse(remoteStr); } catch (e) {}
    }
    const changed = remote ? syncMerge(remote) : false;
    const out = syncPayload();
    if (!gist) { const g = await gh('/gists', {method: 'POST', body: JSON.stringify({description: 'Zpěvník – synchronizace písní', public: false, files: {[SYNC_FILE]: {content: out}}})}); SY.cfg.gistId = g.id; SY.cfg.url = g.html_url; }
    else if (out !== remoteStr) await gh('/gists/' + gist.id, {method: 'PATCH', body: JSON.stringify({files: {[SYNC_FILE]: {content: out}}})});
    SY.sig = syncSig();
    if (changed) { save(true); syncRefresh(); }
    SY.cfg.last = Date.now();
    syncStatus('ok', 'naposledy ' + new Date().toLocaleTimeString('cs-CZ', {hour: '2-digit', minute: '2-digit'}));
    if (manual) toast(changed ? 'Synchronizováno – písně aktualizovány' : 'Synchronizováno, vše je aktuální');
  } catch (e) {
    syncStatus(navigator.onLine ? 'err' : 'offline', e.message);
    if (manual || e.status === 401) toast('Synchronizace selhala: ' + e.message);
  } finally {
    SY.busy = false; syncSaveCfg();
    if (SY.again) { SY.again = false; syncSchedule(800); }
  }
}
const syncSig = () => db.songs.length + ':' + db.songs.reduce((a, x) => a + (x.updated || 0) + (x.transpose || 0), 0) + ':' + Object.keys(db.deleted || {}).length;

  }

  if (bl && state.mode === 'view') { const ln = bl.closest('[data-src]'); if (ln) (bl.classList.contains('custom') ? btabModal : barsModal)(song, +ln.dataset.src); return; }
  if (state.mode === 'view' && state.annot) {
    const note = e.target.closest('[data-note]');
    if (note) { noteModal(song, null, +note.dataset.note); return; }
    const ln = e.target.closest('[data-src]');
    if (ln) noteModal(song, +ln.dataset.src, null);
  }
});
$('#scrollCtl').addEventListener('click', e => {
  const a = e.target.closest('[data-sc]')?.dataset.sc; if (!a) return;
  if (a === 'stop') return stopScroll();
  const st = S(); st.scrollSpeed = Math.max(2, Math.min(200, st.scrollSpeed + (a === '+' ? (st.scrollSpeed >= 30 ? 5 : 2) : (st.scrollSpeed > 30 ? -5 : -2))));
  $('#scSpeed').textContent = st.scrollSpeed; save();
});
$('#main').addEventListener('wheel', () => { /* ruční posun nevadí */ }, {passive: true});
$('#printView').addEventListener('click', e => {
  const a = e.target.closest('[data-pa]')?.dataset.pa; if (!a) return;
  if (a === 'print') window.print();
  else { $('#printView').hidden = true; $('#printView').innerHTML = ''; if (a === 'back') printDialog(null); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#modal').hidden) closeModal();
    else if (!$('#printView').hidden) { $('#printView').hidden = true; $('#printView').innerHTML = ''; }
    else if (scr.on) stopScroll();
  } else if (e.key === ' ' && state.mode === 'view' && $('#modal').hidden && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    e.preventDefault(); scr.on ? stopScroll() : startScroll();
  }
});

load(); applyTheme(); route();
SY.sig = ''; if (SY.cfg.token) { syncStatus(navigator.onLine ? 'busy' : 'offline'); syncSchedule(600); }
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
